<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Older or Newer – „Zeitstrahl“: Zeitleiste als Doppelpfeil von früher (rot, links) bis heute (grün, rechts),
       die Platte sitzt als Regler darauf -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2028"/><stop offset="1" stop-color="#0b0c10"/></linearGradient>
    <radialGradient id="gr" cx="0" cy=".5" r=".75"><stop offset="0" stop-color="#ef4444" stop-opacity=".32"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <radialGradient id="gg" cx="1" cy=".5" r=".75"><stop offset="0" stop-color="#22c55e" stop-opacity=".32"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <linearGradient id="tl" x1="30" y1="0" x2="482" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f87171"/><stop offset=".22" stop-color="#ef4444"/><stop offset=".78" stop-color="#22c55e"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#gr)"/>
  <rect width="512" height="512" fill="url(#gg)"/>

  <!-- Zeitleiste: Doppelpfeil -->
  <path d="M100 232H412V190L486 256L412 322V280H100V322L26 256L100 190Z" fill="url(#tl)" stroke="#0b0c10" stroke-width="6" stroke-linejoin="round"/>

  <!-- Platte als Regler -->
  <g filter="url(#sh)"><circle cx="256" cy="256" r="140" fill="#0d0d11"/></g>
  <g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2.5">
    <circle cx="256" cy="256" r="126"/><circle cx="256" cy="256" r="110"/><circle cx="256" cy="256" r="94"/><circle cx="256" cy="256" r="78"/>
  </g>
  <path d="M256 256L158 157A140 140 0 0 1 203 126Z" fill="#fff" fill-opacity=".09"/>
  <path d="M256 256L354 355A140 140 0 0 1 309 386Z" fill="#fff" fill-opacity=".09"/>
  <!-- Etikett: linke Hälfte rot (älter), rechte grün (neuer) -->
  <path d="M256 202A54 54 0 0 0 256 310Z" fill="#ef4444"/>
  <path d="M256 202A54 54 0 0 1 256 310Z" fill="#22c55e"/>
  <rect x="253" y="202" width="6" height="108" fill="#0d0d11"/>
  <circle cx="256" cy="256" r="11" fill="#0d0d11"/>
</svg>
